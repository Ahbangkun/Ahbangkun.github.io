<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Otome Stream Remote</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
 *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:'Zen Maru Gothic',system-ui,sans-serif;background:linear-gradient(160deg,#ffe3ef,#ffd0e4 60%,#f7c6ff);color:#5a2a45;min-height:100vh;padding:18px}
 h1{font-size:22px;font-weight:900;margin-bottom:4px} .st{font-size:13px;margin-bottom:14px;opacity:.8}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
 button{font:inherit;font-weight:900;font-size:17px;padding:16px 10px;border-radius:18px;border:3px solid #ff7eb3;background:#fff7fb;color:#5a2a45;
   box-shadow:0 5px 0 #ff7eb3;cursor:pointer;touch-action:manipulation;transition:transform .08s}
 button:active,button.hit{transform:translateY(4px);box-shadow:0 1px 0 #ff7eb3;background:#ffc2dc}
 button kbd{display:block;font-size:12px;opacity:.6;margin-top:4px;font-family:inherit}
 .bad{border-color:#5a5a6e;box-shadow:0 5px 0 #5a5a6e}
 .row{display:flex;gap:8px;margin-top:16px} input{flex:1;font:inherit;font-size:17px;padding:14px;border-radius:14px;border:3px solid #ff7eb3}
 .row button{flex:0 0 auto;padding:14px 18px}
 h2{font-size:16px;margin:18px 0 8px}
</style></head><body>
<h1>♡ Otome Stream Remote</h1>
<div class="st" id="st">channel: … · keys work while this page is focused</div>
<h2>Affection</h2>
<div class="grid">
 <button data-c="aff:10">💗 +10 affection<kbd>key 1</kbd></button>
 <button data-c="aff:25">💖 +25 affection<kbd>key 3</kbd></button>
 <button data-c="aff:-10">💔 −10 affection<kbd>key 2</kbd></button>
 <button data-c="hearts">✨ heart burst<kbd>key space</kbd></button>
</div>
<h2>Events</h2>
<div class="grid">
 <button data-c="choice">💬 choice menu<kbd>key C</kbd></button>
 <button data-c="pick:1">➊ pick option 1<kbd>key Q</kbd></button>
 <button data-c="pick:2">➋ pick option 2<kbd>key W</kbd></button>
 <button data-c="pick:3">➌ pick option 3<kbd>key E</kbd></button>
 <button data-c="cg">✦ CG unlocked<kbd>key G</kbd></button>
 <button data-c="rival">⚠ rival appeared<kbd>key R</kbd></button>
 <button data-c="cat">🐱 cat ships it<kbd>key K</kbd></button>
 <button data-c="nervous">😰 nervous<kbd>key N</kbd></button>
 <button data-c="happy">♡ HAPPY END<kbd>key H</kbd></button>
 <button data-c="bad" class="bad">🖤 BAD END<kbd>key B</kbd></button>
 <button data-c="reset">↺ reset meter<kbd>key 0</kbd></button>
</div>
<h2>Make him say…</h2>
<div class="row"><input id="say" placeholder="type a line, press Enter" maxlength="120"><button id="sayb">send</button></div>
<h2>Quick lines</h2>
<div class="grid" id="quick"></div>
<script>
const P=new URLSearchParams(location.search);
if(P.get('mode')==='chuuni'){document.title='Dark Lord Remote';
  document.body.style.background='linear-gradient(160deg,#1a0b26,#2a0a1c 60%,#120818)';document.body.style.color='#f3e6ff';
  document.querySelector('h1').textContent='⛧ Dark Lord Remote';
  const L={'aff:10':'🔥 power +10 (seal −10)','aff:25':'⚡ power +25','aff:-10':'⛓ re-seal +10','hearts':'✦ dark aura','choice':'📜 contract choice','cg':'📓 forbidden grimoire','rival':'😈 demon king','cat':'🐈‍⬛ familiar','nervous':'🧙 level 1 wizard','happy':'封印解除 RELEASE','bad':'🖤 BAD END','reset':'↺ restore seal'};
  document.querySelectorAll('button[data-c]').forEach(b=>{const k=b.querySelector('kbd');if(L[b.dataset.c]){b.textContent=L[b.dataset.c];if(k)b.appendChild(k);}});
  document.querySelectorAll('h2').forEach(h=>{h.textContent={'Affection':'Seal / Power','Events':'Events','Make him say…':'Make the Dark Lord say…','Quick lines':'Quick lines'}[h.textContent]||h.textContent});
}const TOPIC=P.get('remote')||'ahbangkun-c74d709687';
document.getElementById('st').textContent=`channel: ${TOPIC} · keys work while this page is focused`;
function send(c,btn){fetch('https://ntfy.sh/'+encodeURIComponent(TOPIC),{method:'POST',body:c}).catch(()=>{});
  if(btn){btn.classList.add('hit');setTimeout(()=>btn.classList.remove('hit'),150);}}
document.querySelectorAll('button[data-c]').forEach(b=>b.onclick=()=>send(P.get('mode')==='chuuni'&&b.dataset.c==='nervous'?'mage':b.dataset.c,b));
const Q=["thanks for the gift!! you're my favourite (don't tell the others)","welcome new viewer ♡ you're on my route now","chat is so quiet… are you all blushing?","I-I'm not crying, the anime was just sad","tap ❤️ if you'd pick my route","goodnight chat… stay a bit longer?"];
const QC=["your offering has been accepted by the abyss. thank you, mortal.","a new soul enters my domain… welcome.","my right arm… it's reacting to your gift!!","silence. the Organization might be watching.","kukuku… tap ❤️ to weaken my seal.","I must return to the shadows… goodnight, mortals."];
const qd=document.getElementById('quick');(P.get('mode')==='chuuni'?QC:Q).forEach(t=>{const b=document.createElement('button');b.textContent=t;b.style.fontSize='14px';b.onclick=()=>send('say:'+t,b);qd.appendChild(b);});
const inp=document.getElementById('say');const ss=()=>{if(inp.value.trim()){send('say:'+inp.value.trim());inp.value='';}};
document.getElementById('sayb').onclick=ss;inp.addEventListener('keydown',e=>{if(e.key==='Enter')ss();});
const K={'1':'aff:10','2':'aff:-10','3':'aff:25',' ':'hearts','c':'choice','g':'cg','r':'rival','k':'cat','n':'nervous','h':'happy','b':'bad','0':'reset','q':'pick:1','w':'pick:2','e':'pick:3'};
document.addEventListener('keydown',e=>{if(e.target===inp)return;const c=K[e.key.toLowerCase()];if(c){e.preventDefault();
  send(c,document.querySelector(`button[data-c="${c}"]`));}});
</script></body></html>
