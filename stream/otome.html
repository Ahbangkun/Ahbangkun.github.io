<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ahbangkun Otome Route</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Yusei+Magic&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{width:100%;height:100%;overflow:hidden;background:transparent}
  body{width:1080px;height:1920px;overflow:hidden;background:transparent;transform-origin:0 0;position:relative;
       font-family:'Zen Maru Gothic',system-ui,sans-serif;color:#5a2a45}
  .layer{position:absolute;inset:0} .abs{position:absolute}
  body.back #front{display:none} body.front #back{display:none}

  :root{--pink:#ff7eb3;--pink2:#ffc2dc;--rose:#e0457b;--cream:#fff7fb;--ink:#5a2a45}
  #bg{background-size:cover;background-repeat:no-repeat}
  #tint{background:linear-gradient(180deg,rgba(255,170,210,.28),rgba(255,210,230,.10) 45%,rgba(255,150,200,.25))}
  .petal{position:absolute;top:-40px;width:26px;height:20px;border-radius:70% 0 70% 0;background:#ffc2dc;opacity:.85;animation:fall linear infinite}
  @keyframes fall{to{transform:translate(var(--dx),2000px) rotate(720deg)}}

  /* VN-style frosted panels */
  .vn{background:rgba(255,247,251,.88);border:4px solid var(--pink);border-radius:26px;
      box-shadow:0 0 0 4px #fff inset,0 10px 30px rgba(224,69,123,.25)}
  #route{left:44px;top:218px;padding:10px 26px 10px 14px;display:flex;align-items:center;gap:14px;font-size:36px;font-weight:900}
  #route .tag{background:var(--rose);color:#fff;font-size:22px;padding:6px 14px;border-radius:12px;letter-spacing:1px}
  #clock{right:44px;top:218px;padding:10px 24px;font-size:32px;font-weight:700}
  #aff{left:44px;right:44px;top:312px;padding:12px 22px;display:flex;align-items:center;gap:16px}
  #aff .lab{font-size:28px;font-weight:900;white-space:nowrap}
  #aff .hearts{font-size:34px;letter-spacing:2px;color:var(--rose);white-space:nowrap}
  #aff .track{flex:1;height:20px;border-radius:999px;background:#ffe3ef;border:3px solid var(--pink);overflow:hidden}
  #aff .fill{height:100%;background:linear-gradient(90deg,#ff9fc6,#ff5c9a);transition:width .8s}
  #aff .lv{font-size:26px;font-weight:900;white-space:nowrap}

  /* dialogue box (front) */
  #dlg{left:36px;right:36px;top:1150px;height:270px;padding:46px 40px 20px}
  #dlg .nm{position:absolute;left:34px;top:-30px;background:var(--rose);color:#fff;font-size:34px;font-weight:900;padding:6px 30px;border-radius:16px;
           border:4px solid #fff;box-shadow:0 6px 16px rgba(224,69,123,.35)}
  #dlg .tx{font-family:'Yusei Magic','Zen Maru Gothic',sans-serif;font-size:42px;line-height:1.45;min-height:120px}
  #dlg .nx{position:absolute;right:34px;bottom:20px;color:var(--rose);font-size:30px;animation:bob 1s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(8px)}}
  #dlg .menu{position:absolute;right:30px;top:12px;display:flex;gap:16px;font-size:20px;font-weight:900;color:#c77a9d;letter-spacing:1px}

  /* choices */
  #choices{left:110px;right:110px;top:520px;display:flex;flex-direction:column;gap:22px;opacity:0;transform:translateY(20px);transition:all .4s;pointer-events:none}
  #choices.show{opacity:1;transform:none}
  #choices .q{text-align:center;font-size:36px;font-weight:900;color:#fff;text-shadow:0 2px 0 var(--rose),0 0 14px var(--rose)}
  .ch{padding:20px 30px;font-size:36px;font-weight:900;text-align:center;transition:all .3s}
  .ch.pick{background:var(--rose);color:#fff;transform:scale(1.06);border-color:#fff}
  .ch.fade{opacity:.35;transform:scale(.96)}

  /* events */
  #ev{left:0;right:0;top:470px;text-align:center;opacity:0;transform:scale(.4);transition:all .5s cubic-bezier(.3,1.7,.5,1);pointer-events:none}
  #ev.show{opacity:1;transform:scale(1)}
  #ev .ttl{display:inline-block;font-size:76px;font-weight:900;color:#fff;-webkit-text-stroke:3px var(--rose);paint-order:stroke fill;
           text-shadow:0 6px 0 var(--rose),0 0 30px #ff9fc6}
  #ev img{display:block;margin:16px auto;max-height:380px;max-width:640px;border-radius:20px}
  #ev .cap{display:inline-block;padding:14px 30px;font-size:40px;font-weight:900}
  #ev.cg img{border:10px solid #fff;box-shadow:0 0 0 5px var(--pink),0 16px 40px rgba(0,0,0,.25);transform:rotate(-2deg)}
  #ev.bad .ttl{color:#3b3b4f;-webkit-text-stroke:3px #fff;text-shadow:0 6px 0 #222}
  #veil{inset:0;background:radial-gradient(circle,rgba(255,255,255,.0) 30%,rgba(255,120,180,.55));opacity:0;transition:opacity .5s;pointer-events:none}
  #veil.on{opacity:1} #veil.dark{background:radial-gradient(circle,rgba(0,0,0,.1) 30%,rgba(20,10,30,.7))}
  .hb{position:absolute;font-size:60px;animation:hb 1.8s ease-out forwards;pointer-events:none}
  @keyframes hb{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1.3);opacity:0}}


  /* beat pulse */
  body.beat #dlg{animation:pulse var(--beat) ease-out infinite}
  body.beat #aff .hearts{display:inline-block;animation:hpulse var(--beat) ease-out infinite}
  body.beat #route{animation:pulse var(--beat) ease-out infinite}
  body.beat #bg{animation:zoom var(--beat) ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 4px #fff inset,0 0 0 0 rgba(255,126,179,.9),0 10px 30px rgba(224,69,123,.25)}
                   60%,100%{box-shadow:0 0 0 4px #fff inset,0 0 0 18px rgba(255,126,179,0),0 10px 30px rgba(224,69,123,.25)}}
  @keyframes hpulse{0%{transform:scale(1.25)}50%,100%{transform:scale(1)}}
  @keyframes zoom{0%{transform:scale(1.012)}50%,100%{transform:scale(1)}}
  #choices .hint{text-align:center;font-size:30px;font-weight:900;color:#fff;text-shadow:0 2px 0 var(--rose)}

  /* full scenes */
  #scene{display:none;left:70px;right:70px;top:520px;text-align:center;padding:50px 40px}
  #scene .logo{font-family:'Yusei Magic',sans-serif;font-size:84px;line-height:1.15;color:var(--rose);text-shadow:0 4px 0 #fff,0 0 24px #ffc2dc}
  #scene .sub{font-size:40px;font-weight:700;margin-top:18px}
  #scene .menu{margin-top:30px;display:flex;flex-direction:column;gap:14px;font-size:40px;font-weight:900}
  #scene .menu div:first-child{color:var(--rose)} #scene .menu div:first-child::before{content:'▶ '}
  #scene .count{font-size:84px;font-weight:900;color:var(--rose);margin-top:16px}
  #scene img{height:240px;margin-top:20px}
  .spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="back" class="layer">
  <div id="bg" class="layer"></div>
  <div id="tint" class="layer"></div>
  <div id="petals" class="layer"></div>
  <div id="scene" class="abs vn"></div>
  <div id="route" class="abs vn"><span class="tag">ROUTE</span><span id="nameText"></span> ♡</div>
  <div id="clock" class="abs vn">--:--</div>
  <div id="aff" class="abs vn"><span class="lab">好感度</span><span class="hearts" id="hearts"></span><div class="track"><div class="fill"></div></div><span class="lv" id="lv"></span></div>
</div>
<div id="front" class="layer">
  <div id="veil" class="abs"></div>
  <div id="choices" class="abs"></div>
  <div id="ev" class="abs"></div>
  <div id="dlg" class="abs vn"><div class="nm" id="dname"></div><div class="menu">AUTO · SKIP · SAVE · LOG</div><div class="tx" id="tx"></div><div class="nx">▼</div></div>
</div>
<script>
/* Illustrations: いらすとや (irasutoya.com) by Takashi Mifune — free material, used within its terms (under 20 images) */
const B='https://blogger.googleusercontent.com/img/b/R29vZ2xl/';
const IMG={
 room:B+'AVvXsEivQtfkDmT4XxkZqnzig34l58biFKE43rSfOCtrsX3lmPGme_OEAnfOzcq6RjeoLZ-Tf_lkY-CgOJ9Bwygv1NGZeQTSatSXC0qymojIAmnFHuLcbTQKx_V7QpjeTO-aFCtojA8IXiYW0VR8/s1600/bg_room_syosai_book.jpg',
 confess:B+'AVvXsEgmQ_6f-ffGbBY_6nLdDiAim9Gy1vaDrlR_3VD4ZL2xSc0FSMZNg7cTpl9mXUP0e2whx0YBxtTpyn7l-IYnU1rCfmvbAxL7rY2yDTU3qwTULxhLM3oG9-ENfXkeQ9XhB4ek1YtDi6rQ-a-D/s800/kokuhaku_schoolgirl.png',
 letter:B+'AVvXsEgpv75wzyRROer3HlDnM6xJsMpM04Ib2JvqV4i4Wl4kfwhKVSIIaJAU-xr6CW4gfu1QH0Xvpk7MmMHAj6BR3GCfPzx9sf0-itnfhUO5vIZ3nALfQIrKyBsftumB5Xql9PbV8SIolHisR0ne/s800/message_loveletter_girl.png',
 broken:B+'AVvXsEgjw964Fmi8ZGnQ45mMfrE6P0erR9Sf5y3SBhBNPgOidQubHcXPDb0jhkg8iSDgQWCqFrxMgbQ5M53mH87ukGprQkn7d8wyT08u9orDyW9om4wO1paNG6BR6kAtshHCmkv3lBUQPhCBYLo/s800/shitsuren_heart.png',
 dumped:B+'AVvXsEjhxWFZT6tYkc_o2oRAo8ZiuRPYYFhCDqibWTH2KH7xKp6GNs92cClW1f8laBFpp6cW4muHPlCDIDdaCWBhsWXaQzIK3erOJpmj1_3WBPlD1_h-hCpe4yr7YTNZBobOccyL6c-_GzcJQsI/s800/shitsuren_man.png',
 cat:B+'AVvXsEhMSxsv2IZwVffkBdcGN-mi5Jnrv-0vU3GocZMBAQ894jE1Rk7jJI-4HJXz-L15NP1l-kv1Jo2xUzBBIqqZBoNxGhOHTuKFjqh_0_EaZ5d-o0sjM8Lem9lrWumfICrxwreNzUPLfgglv66g/s800/pet_tehe_cat.png',
 cheek:B+'AVvXsEiPz936DPLjBT11FxCGKXrA45UPuNvGINDy-cmq9-IAQ3gHisCphf9sHu_zYmYCon0DcC_CDCBj7PTcojyEtl-4SEI8EsTiYF4lQbe2zjBQfYz2J2nphc0ge_juZDb1aQ1SmpuowGsvSY76qzlOcTEkps8_jW5hcgOycBQZlQjNfepnFYb7Ux0UoxTw89wT/s800/pose_hoppe_heart_schoolgirl.png',
 nervous:B+'AVvXsEhTAL_gJ2HDBQxk_34wqhG3nZ5vptJDvhdRTO7XFobCyaLogFjzOypsjOddG-K0RZ2JhMGL1I-LEpIydfAsR7dz8V6YdORgEaM18GD9yBXxvb6y41pw_hoYfowTx4u-VyKEz_Jd5itQBDM/s800/kinchou_man.png'
};
function fit(){const W=innerWidth,H=innerHeight,k=Math.min(W/1080,H/1920);
  document.body.style.transform=`translate(${(W-1080*k)/2}px,${(H-1920*k)/2}px) scale(${k})`;}
fit();addEventListener('resize',fit);

const P=new URLSearchParams(location.search),get=(k,d)=>P.has(k)?P.get(k):d,$=id=>document.getElementById(id),R=Math.random,pick=a=>a[Math.floor(R()*a.length)];
const cfg={part:get('part','both'),scene:get('scene','main'),name:get('name','Ahbangkun'),aff:+get('aff',30),min:+get('min',5),bgx:get('bgx','50'),every:+get('event',35),bpm:+get('bpm',0),poll:get('poll',''),meter:get('meter','1')};
if(cfg.part!=='both')document.body.classList.add(cfg.part);
const NAME=cfg.name.replace(/^@/,'');
if(cfg.bpm>0){document.body.classList.add('beat');document.body.style.setProperty('--beat',(60/cfg.bpm)+'s');}
if(cfg.meter==='0')document.getElementById('aff').style.display='none';

$('bg').style.backgroundImage=`url("${IMG.room}")`;$('bg').style.backgroundPosition=`${cfg.bgx}% 50%`;
for(let i=0;i<18;i++){const p=document.createElement('div');p.className='petal';
  p.style.left=(R()*1080)+'px';p.style.setProperty('--dx',(R()*300-150)+'px');p.style.animationDuration=(9+R()*9)+'s';p.style.animationDelay=(-R()*18)+'s';$('petals').appendChild(p);}
$('nameText').textContent='@'+NAME;$('dname').textContent=NAME;
const tick=()=>$('clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});tick();setInterval(tick,10000);

/* affection meter */
let aff=cfg.aff;
const LV=[[0,'stranger'],[20,'acquaintance'],[40,'friend?'],[60,'crush'],[80,'dating??'],[100,'MARRIED']];
function setAff(){aff=Math.max(0,Math.min(100,aff));$('aff').querySelector('.fill').style.width=aff+'%';
  const n=Math.round(aff/20);$('hearts').textContent='♥'.repeat(n)+'♡'.repeat(5-n);
  $('lv').textContent=[...LV].reverse().find(l=>aff>=l[0])[1];}
setAff();

/* typewriter dialogue */
const LINES=[
 "...it's not like I went live for you or anything. b-baka.",
 "you tapped ❤️? ...I'll remember that. forever.",
 "follow me and I'll... think about it. 👉👈",
 "chat, stop flirting. I'm trying to stream here.",
 "if you leave now, you get the BAD END. just saying.",
 "this is my route. no skipping cutscenes.",
 "you're not like the other viewers… you actually stayed.",
 "*looks away* ...you have nice comments.",
 "I don't need gifts. ...but a rose wouldn't hurt.",
 "the narrator says I'm blushing. the narrator is lying.",
];
let typing=null;
function type(t,name=NAME){$('dname').textContent=name;const el=$('tx');clearInterval(typing);el.textContent='';let i=0;
  typing=setInterval(()=>{el.textContent=t.slice(0,++i);if(i>=t.length)clearInterval(typing)},45);}
let li=0;
if(cfg.scene==='main'&&cfg.part!=='back'){type(LINES[0]);setInterval(()=>{if(!busy){li=(li+1)%LINES.length;type(LINES[li]);}},9000);}

/* hearts burst */
function burst(n=14,e='💗'){for(let i=0;i<n;i++){const h=document.createElement('div');h.className='hb';h.textContent=pick([e,'💕','💖','♡']);
  h.style.left=(500+R()*80)+'px';h.style.top=(900+R()*80)+'px';h.style.setProperty('--x',(R()*700-350)+'px');h.style.setProperty('--y',(-R()*600-100)+'px');
  $('front').appendChild(h);setTimeout(()=>h.remove(),1900);}}
let busy=false;
function event(html,cls='',ms=4500,veil=''){busy=true;const e=$('ev');e.className='abs '+cls;e.innerHTML=html;void e.offsetWidth;e.classList.add('show');
  if(veil){$('veil').className='abs on '+(veil==='dark'?'dark':'');}
  setTimeout(()=>{e.classList.remove('show');$('veil').className='abs';busy=false;},ms);}

/* choice menu: one option gets "picked" by fate */
const CHOICES=[
 {q:'He looks at you. What do you do?',o:[['❤ Tap like',10,'"...you did that on purpose." 😳'],['✦ Follow him',25,'"w-wait, you followed me? ...okay. we\'re official."'],['💤 Swipe away',-40,'BAD']]},
 {q:'He says "nice weather today". You:',o:[['"you\'re nicer" 😏',20,'"STOP. my model is blushing."'],['send a rose 🌹',30,'"a rose?? I\'m framing this."'],['"ok"',-10,'"...ok." (affection decreased)']]},
 {q:'It\'s 3AM. He\'s still live.',o:[['stay with him',15,'"you stayed? ...go sleep. no wait, stay."'],['"go sleep"',5,'"you care about me?? 🥺"'],['leave silently',-40,'BAD']]},
];
function pollChoice(){if(busy)return;busy=true;const [q,...opts]=cfg.poll.split('|');const box=$('choices');
  box.innerHTML=`<div class="q">${q||'What should he do?'}</div>`+opts.map(o=>`<div class="ch vn">${o}</div>`).join('')+`<div class="hint">vote in the poll ♡ send the gift to choose!</div>`;
  box.classList.add('show');type(pick(['chat… decide my fate. vote in the poll ♡','your gifts choose my route. no pressure. (pressure)','the poll decides. I trust you… mostly.']));
  setTimeout(()=>{box.classList.remove('show');busy=false;},12000);}
function choice(){if(cfg.poll)return pollChoice();if(busy)return;busy=true;const c=pick(CHOICES),box=$('choices');
  box.innerHTML=`<div class="q">${c.q}</div>`+c.o.map(o=>`<div class="ch vn">${o[0]}</div>`).join('');box.classList.add('show');
  type('( choose wisely... )','Narrator');
  const w=[.42,.4,.18],r=R();const k=r<w[0]?0:r<w[0]+w[1]?1:2;
  setTimeout(()=>{[...box.querySelectorAll('.ch')].forEach((el,i)=>el.classList.add(i===k?'pick':'fade'));},2600);
  setTimeout(()=>{box.classList.remove('show');const o=c.o[k];
    if(o[2]==='BAD'){aff+=o[1];setAff();busy=false;
      event(`<div class="ttl">BAD END</div><img src="${IMG.dumped}" alt=""><span class="cap vn">he went live without you… 💔<br><small>▶ load save? tap ❤️</small></span>`,'bad',5200,'dark');
      type('...you left. the stream felt empty. (just kidding, come back)');}
    else{aff+=o[1];setAff();burst();busy=false;type(o[2]);
      event(`<div class="ttl">好感度 ${o[1]>0?'+':''}${o[1]} ♡</div>`,'',2600,'pink');}
    if(aff>=100)setTimeout(happy,3000);
  },4400);}
function happy(){event(`<div class="ttl">♡ HAPPY END ♡</div><img src="${IMG.cheek}" alt=""><span class="cap vn">${NAME}'s route complete!<br><small>New Game+ unlocked</small></span>`,'',6000,'pink');
  burst(30);setTimeout(()=>{aff=10;setAff();type('new game+... I still remember you, though.')},6000);}
const RANDOM=[
 ()=>event(`<div class="ttl">✦ CG UNLOCKED ✦</div><img src="${IMG.letter}" alt=""><span class="cap vn">"a love letter from chat"</span>`,'cg',4600,'pink'),
 ()=>{event(`<div class="ttl">⚠ RIVAL APPEARED</div><img src="${IMG.confess}" alt=""><span class="cap vn">another viewer confessed first!!<br><small>tap ❤️ to fight back</small></span>`,'',5000,'pink');type('w-wait, I didn\'t say yes to her!!')},
 ()=>{event(`<img src="${IMG.cat}" alt=""><span class="cap vn">the cat ships it 🐱💕</span>`,'',3800);type('even my cat approves. that\'s canon now.')},
 ()=>{event(`<img src="${IMG.nervous}" alt=""><span class="cap vn">*${NAME} is nervous*<br><small>(sweating in 4K)</small></span>`,'',3800);type('i-i\'m not nervous. the room is just hot.')},
];
if(cfg.scene==='main'&&cfg.part!=='back'){
  setTimeout(choice,6000);
  setInterval(()=>{if(busy)return;R()<.55?choice():pick(RANDOM)();},cfg.every*1000);
}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='c')choice();if(k==='h')happy();if(k==='e')pick(RANDOM)();});

/* ===== remote control: listens on a private ntfy.sh channel ===== */
const TOPIC=get('remote','ahbangkun-c74d709687');
function cmd(c){c=(c||'').trim();if(!c)return;
  if(c.startsWith('say:')){type(c.slice(4));return;}
  if(c.startsWith('aff:')){const n=+c.slice(4);aff+=n;setAff();if(n>0)burst();event(`<div class="ttl">好感度 ${n>0?'+':''}${n} ♡</div>`,'',2400,'pink');if(aff>=100)setTimeout(happy,2600);return;}
  busy=false;
  ({choice:()=>choice(),happy:()=>happy(),
    cg:()=>RANDOM[0](),rival:()=>RANDOM[1](),cat:()=>RANDOM[2](),nervous:()=>RANDOM[3](),
    bad:()=>{event(`<div class="ttl">BAD END</div><img src="${IMG.dumped}" alt=""><span class="cap vn">he went live without you… 💔<br><small>▶ load save? tap ❤️</small></span>`,'bad',5200,'dark');type('...you left. (just kidding, come back)');},
    hearts:()=>burst(30),reset:()=>{aff=cfg.aff;setAff();}}[c]||(()=>{}))();}
if(cfg.part!=='back'&&cfg.scene==='main'&&TOPIC!=='0'){
  try{const es=new EventSource('https://ntfy.sh/'+encodeURIComponent(TOPIC)+'/sse');
    es.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.event==='message')cmd(d.message)}catch(_){}};}catch(_){}}
document.addEventListener('keydown',e=>{const m={'1':'aff:10','2':'aff:-10','b':'bad','r':'rival','g':'cg','k':'cat','n':'nervous'}[e.key.toLowerCase()];if(m)cmd(m)});

/* full scenes */
if(cfg.scene!=='main'){
  const s=$('scene');s.style.display='block';$('aff').style.display='none';
  if(cfg.scene==='starting'){
    s.innerHTML=`<div class="logo">${NAME}'s<br>Heart Route ♡</div><div class="sub">an otome stream — chapter: today</div><div class="count" id="cd"></div><div class="menu"><div>New Game</div><div>Continue</div><div>Settings</div></div>`;
    const end=Date.now()+cfg.min*60000;const up=()=>{const r=Math.max(0,end-Date.now());
      $('cd').textContent=r?`${String(Math.floor(r/60000)).padStart(2,'0')}:${String(Math.floor(r/1000)%60).padStart(2,'0')}`:'press ❤️ to start';};up();setInterval(up,500);
  } else if(cfg.scene==='brb'){
    s.innerHTML=`<div class="logo">saving<span class="spin">✿</span></div><div class="sub">do not turn off the stream.<br>${NAME} will return shortly ♡</div><img src="${IMG.cat}" alt="">`;
  } else {
    s.innerHTML=`<div class="logo">♡ HAPPY END ♡</div><div class="sub">thank you for choosing my route.<br>to be continued…</div><img src="${IMG.cheek}" alt="">`;
  }
}
</script>
</body>
</html>
