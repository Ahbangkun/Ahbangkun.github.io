<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cozy Room Stream Scene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{width:100%;height:100%;overflow:hidden;background:transparent}
  body{width:1080px;height:1920px;overflow:hidden;background:transparent;transform-origin:0 0;
       font-family:'Fredoka',system-ui,sans-serif;color:#fff4fb;position:relative}
  .abs{position:absolute}
  .layer{position:absolute;inset:0}

  /* ===== WALL ===== */
  #wall{background:
      radial-gradient(ellipse 700px 500px at 10% 78%, rgba(255,178,107,.22), transparent 70%),
      radial-gradient(ellipse 600px 600px at 50% 40%, rgba(150,110,255,.18), transparent 70%),
      linear-gradient(180deg,#191433 0%,#221a45 45%,#2a1f52 100%)}
  #wall::after{content:"";position:absolute;inset:0;opacity:.08;
      background-image:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 90px)}

  /* ===== WINDOW ===== */
  #window{left:180px;top:470px;width:720px;height:640px;border-radius:26px 26px 10px 10px;overflow:hidden;
      background:linear-gradient(180deg,#0b1240 0%,#23215f 55%,#4a2d78 85%,#7a3c86 100%);
      box-shadow:0 0 0 18px #3a2d5e,0 0 0 22px #4b3b78,0 30px 80px rgba(0,0,0,.45)}
  #window .bar{position:absolute;background:#3a2d5e}
  .star{position:absolute;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
  #moon{left:470px;top:70px;width:120px;height:120px;border-radius:50%;background:#fff3d1;
      box-shadow:0 0 40px 12px rgba(255,236,190,.55),0 0 120px 40px rgba(255,236,190,.18)}
  #moon::after{content:"";position:absolute;left:38px;top:-10px;width:110px;height:110px;border-radius:50%;background:#14194a}
  .bld{position:absolute;bottom:0;background:#120f2c}
  .bld::after{content:"";position:absolute;inset:18px 12px 0;
      background-image:radial-gradient(circle,#ffd98a 3px,transparent 4px);background-size:26px 34px;opacity:.75}
  .bld.dim::after{opacity:.35}
  .shoot{position:absolute;width:160px;height:3px;border-radius:3px;background:linear-gradient(90deg,#fff,transparent);
      transform:rotate(-20deg);opacity:0;animation:shoot 9s linear infinite}
  @keyframes shoot{0%,88%{opacity:0;transform:translate(0,0) rotate(-20deg)}90%{opacity:1}100%{opacity:0;transform:translate(-420px,150px) rotate(-20deg)}}

  /* curtains */
  .curtain{top:440px;width:170px;height:760px;border-radius:0 0 80px 80px;
      background:repeating-linear-gradient(90deg,#b56bd6 0 22px,#9a52c0 22px 44px);
      box-shadow:inset 0 -40px 60px rgba(0,0,0,.25)}
  #cl{left:110px;transform-origin:top left;animation:sway 7s ease-in-out infinite}
  #cr{left:800px;transform-origin:top right;animation:sway 7s ease-in-out infinite reverse}
  @keyframes sway{50%{transform:skewX(1.5deg)}}
  #rod{left:80px;top:425px;width:920px;height:16px;border-radius:8px;background:#e8c27a;box-shadow:0 4px 10px rgba(0,0,0,.3)}

  /* fairy lights */
  #lights{left:0;top:380px;width:1080px;height:160px;overflow:visible}
  .bulb{animation:glow 2.4s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}

  /* shelf + posters */
  #shelf{left:40px;top:1150px;width:150px;height:14px;background:#4b3b78;border-radius:4px}
  .book{position:absolute;bottom:14px;border-radius:3px 3px 0 0}
  #poster{left:925px;top:640px;width:120px;height:170px;border-radius:10px;transform:rotate(4deg);
      background:linear-gradient(160deg,#ff9ed2,#9d7bff);box-shadow:0 10px 30px rgba(0,0,0,.35);
      display:flex;align-items:center;justify-content:center;font-family:'Pacifico';font-size:30px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2)}
  #poster::before{content:"";position:absolute;top:-10px;left:50px;width:22px;height:22px;border-radius:50%;background:#ffd76a}

  /* ===== UI (glass, small) ===== */
  .glass{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.28);
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;
      box-shadow:0 8px 30px rgba(10,5,40,.35)}
  #name{left:50px;top:220px;padding:14px 30px 14px 22px;font-size:40px;font-weight:600;display:flex;gap:14px;align-items:center}
  #name .live{font-size:24px;font-weight:700;background:#ff4f8b;padding:4px 14px;border-radius:999px;letter-spacing:2px}
  #clock{right:50px;top:220px;padding:14px 28px;font-size:36px;font-weight:500}
  #pity{left:50px;right:50px;top:318px;height:62px;display:flex;align-items:center;padding:0 12px;gap:16px}
  #pity .ic{font-size:30px;padding-left:8px}
  #pity .track{flex:1;height:22px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden}
  #pity .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#9d7bff,#ff9ed2,#ffd76a);
      background-size:200% 100%;animation:sh 4s linear infinite;transition:width 1s}
  @keyframes sh{to{background-position:200% 0}}
  #pity .txt{font-size:28px;font-weight:600;padding-right:12px;white-space:nowrap}

  /* ===== DESK (front layer) ===== */
  #desk{left:-20px;top:1340px;width:1120px;height:600px;
      background:linear-gradient(180deg,#5a4688 0,#463670 14px,#35295a 40px,#271e45 100%);
      border-radius:30px 30px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.35)}
  #kb{left:300px;top:1300px;width:480px;height:70px;border-radius:14px;background:#efe6ff;
      box-shadow:0 6px 0 #b9a9e6,0 0 30px rgba(255,158,210,.45);
      background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(120,100,190,.18) 6px 8px),
                       repeating-linear-gradient(0deg,transparent 0 16px,rgba(120,100,190,.18) 16px 18px)}
  #mug{left:120px;top:1225px;width:96px;height:120px;border-radius:10px 10px 26px 26px;background:#ff9ed2;box-shadow:inset -14px 0 0 rgba(0,0,0,.1)}
  #mug::after{content:"";position:absolute;right:-34px;top:26px;width:40px;height:56px;border:12px solid #ff9ed2;border-left:none;border-radius:0 30px 30px 0}
  .steam{position:absolute;width:16px;height:70px;border-radius:50%;border-left:5px solid rgba(255,255,255,.55);animation:steam 3s ease-in-out infinite;opacity:0}
  @keyframes steam{0%{opacity:0;transform:translateY(10px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-60px) scaleX(1.4)}}
  #plant{left:20px;top:1150px;width:90px;height:200px}

  /* gacha capsule machine */
  #gacha{left:820px;top:1080px;width:200px;height:280px}
  #gacha .dome{position:absolute;left:10px;top:0;width:180px;height:170px;border-radius:50% 50% 20px 20px;
      background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(255,255,255,.08) 40%,rgba(255,255,255,.12));
      border:4px solid rgba(255,255,255,.6);overflow:hidden}
  #gacha .ball{position:absolute;width:44px;height:44px;border-radius:50%;border:3px solid rgba(0,0,0,.15)}
  #gacha .base{position:absolute;left:0;top:160px;width:200px;height:120px;border-radius:18px;background:linear-gradient(180deg,#ff5f9e,#d93b7c);
      box-shadow:inset 0 -10px 0 rgba(0,0,0,.15)}
  #gacha .knob{position:absolute;left:70px;top:185px;width:60px;height:60px;border-radius:50%;background:#ffe9a8;border:6px solid #fff;transition:transform .6s}
  #gacha .knob::after{content:"";position:absolute;left:21px;top:-2px;width:6px;height:52px;background:#d93b7c;border-radius:3px}
  #gacha.spin .knob{transform:rotate(360deg)}
  #gacha.spin .dome{animation:jig .15s linear 6}
  @keyframes jig{50%{transform:translateX(4px) rotate(1deg)}}

  /* pull toast */
  #toast{left:50%;top:420px;transform:translate(-50%,40px) scale(.8);opacity:0;padding:18px 34px;
      display:flex;align-items:center;gap:18px;transition:all .5s cubic-bezier(.3,1.6,.5,1);white-space:nowrap}
  #toast.show{transform:translate(-50%,0) scale(1);opacity:1}
  #toast .tier{font-weight:700;font-size:44px;padding:2px 18px;border-radius:14px;color:#2a1f52}
  #toast .msg{font-size:34px;font-weight:600}
  #toast .stars{font-size:28px;color:#ffd76a}

  /* ===== FULL SCENES ===== */
  #neon{left:0;right:0;top:600px;text-align:center;display:none}
  #neon .sign{display:inline-block;font-family:'Pacifico',cursive;font-size:130px;line-height:1.15;color:#fff;
      text-shadow:0 0 8px #fff,0 0 22px #ff9ed2,0 0 50px #ff6fb5,0 0 90px #b46bff;animation:flick 6s infinite}
  @keyframes flick{0%,93%,97%,100%{opacity:1}94%,96%{opacity:.55}}
  #neon .sub{margin-top:40px;display:inline-block;padding:16px 40px;font-size:44px;font-weight:600}
  #neon .count{display:block;margin:30px auto 0;width:max-content;padding:10px 40px;font-size:80px;font-weight:700;letter-spacing:4px}

  /* parts */
  body.back  #front{display:none}
  body.front #back{display:none}
</style>
</head>
<body>
<div id="back" class="layer">
  <div id="wall" class="layer"></div>
  <div id="window" class="abs">
    <div id="sky"></div>
    <div id="moon" class="abs"></div>
    <div class="shoot" style="left:620px;top:60px"></div>
    <div id="city"></div>
    <div class="bar" style="left:355px;top:0;width:12px;height:640px"></div>
    <div class="bar" style="left:0;top:300px;width:720px;height:12px"></div>
  </div>
  <div id="rod" class="abs"></div>
  <div id="cl" class="abs curtain"></div>
  <div id="cr" class="abs curtain"></div>
  <svg id="lights" class="abs" viewBox="0 0 1080 160"></svg>
  <div id="poster" class="abs">♡</div>
  <div id="shelf" class="abs"></div>

  <div id="neon" class="abs"></div>

  <div id="name" class="abs glass"><span class="live">LIVE</span><span id="nameText"></span></div>
  <div id="clock" class="abs glass">--:--</div>
  <div id="pity" class="abs glass"><span class="ic">🎰</span><div class="track"><div class="fill"></div></div><span class="txt"></span></div>
</div>

<div id="front" class="layer">
  <div id="desk" class="abs"></div>
  <svg id="plant" class="abs" viewBox="0 0 90 200">
    <path d="M45 120 C20 80 10 60 18 30 C35 55 45 80 45 120Z" fill="#6fd6a2"/>
    <path d="M45 120 C70 85 82 60 75 20 C58 50 48 80 45 120Z" fill="#4fbf8a"/>
    <path d="M45 125 C40 95 45 70 52 50 C58 80 52 100 45 125Z" fill="#8ae6b6"/>
    <rect x="18" y="118" width="54" height="72" rx="10" fill="#ffd0a0"/>
    <rect x="18" y="118" width="54" height="14" rx="6" fill="#f2b680"/>
  </svg>
  <div id="mug" class="abs">
    <div class="steam" style="left:26px;top:-80px"></div>
    <div class="steam" style="left:54px;top:-90px;animation-delay:1.2s"></div>
  </div>
  <div id="kb" class="abs"></div>
  <div id="gacha" class="abs"><div class="dome"></div><div class="base"></div><div class="knob"></div></div>
  <div id="toast" class="abs glass"></div>
</div>

<script>
/* fit 1080x1920 into any source size */
function fit(){const W=innerWidth,H=innerHeight,k=Math.min(W/1080,H/1920);
  document.body.style.transform=`translate(${(W-1080*k)/2}px,${(H-1920*k)/2}px) scale(${k})`;}
fit(); addEventListener('resize',fit);

const P=new URLSearchParams(location.search), get=(k,d)=>P.has(k)?P.get(k):d;
const cfg={ part:get('part','both'), scene:get('scene','main'), name:get('name','@Ahbangkun'),
  goal:get('goal','pity'), cur:+get('cur',37), target:+get('target',100), pull:+get('pull',45), min:+get('min',5) };
if(cfg.part!=='both') document.body.classList.add(cfg.part);
const $=id=>document.getElementById(id), px=n=>n+'px', R=Math.random;

/* sky + city */
const win=$('window');
for(let i=0;i<70;i++){const s=document.createElement('div');s.className='star';const z=1+R()*3;
  Object.assign(s.style,{left:px(R()*720),top:px(R()*330),width:px(z),height:px(z),animationDelay:(-R()*3)+'s'});win.insertBefore(s,$('moon'));}
let x=-10;const city=$('city');
while(x<730){const w=60+R()*90,h=120+R()*220;const b=document.createElement('div');b.className='bld'+(R()<.4?' dim':'');
  Object.assign(b.style,{left:px(x),width:px(w),height:px(h)});city.appendChild(b);x+=w-4;}

/* fairy lights along a sagging string */
const svg=$('lights'),cols=['#ffd76a','#ff9ed2','#9dd8ff','#c7a6ff','#ffb86b'];
let path='M0 30 Q270 150 540 60 Q810 -20 1080 90';
svg.innerHTML=`<defs><filter id="g"><feGaussianBlur stdDeviation="6"/></filter></defs><path d="${path}" stroke="#2c2350" stroke-width="4" fill="none"/>`;
const tmp=document.createElementNS('http://www.w3.org/2000/svg','path');tmp.setAttribute('d',path);svg.appendChild(tmp);
const L=tmp.getTotalLength();tmp.remove();
for(let i=1;i<22;i++){const p=tmp.getPointAtLength? null:null;}
const pth=svg.querySelector('path');
for(let i=1;i<22;i++){const p=pth.getPointAtLength(L*i/22),c=cols[i%cols.length],d=(-R()*2.4).toFixed(2);
  svg.insertAdjacentHTML('beforeend',`<g class="bulb" style="animation-delay:${d}s"><circle cx="${p.x}" cy="${p.y+12}" r="16" fill="${c}" filter="url(#g)"/><circle cx="${p.x}" cy="${p.y+12}" r="8" fill="${c}"/></g>`);}

/* shelf books */
[['#ff9ed2',26,70],['#9dd8ff',22,84],['#ffd76a',30,60],['#c7a6ff',20,76]].reduce((x,[c,w,h])=>{
  const b=document.createElement('div');b.className='book';Object.assign(b.style,{left:px(x),width:px(w),height:px(h),background:c});$('shelf').appendChild(b);return x+w+4},10);

/* capsule balls */
const dome=document.querySelector('#gacha .dome'),bc=['#ff9ed2','#9dd8ff','#ffd76a','#c7a6ff','#8ae6b6','#ff8a8a'];
[[12,110],[52,118],[94,112],[134,104],[30,72],[74,78],[116,70],[52,36],[96,40]].forEach(([l,t],i)=>{
  const b=document.createElement('div');b.className='ball';
  Object.assign(b.style,{left:px(l),top:px(t),background:`linear-gradient(180deg,${bc[i%bc.length]} 50%,#fff 50%)`,transform:`rotate(${R()*360}deg)`});dome.appendChild(b);});

/* UI */
$('nameText').textContent=cfg.name;
const tick=()=>$('clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});tick();setInterval(tick,10000);
if(cfg.goal==='0') $('pity').style.display='none';
else { $('pity').querySelector('.fill').style.width=Math.max(6,Math.min(100,cfg.cur/cfg.target*100))+'%';
  $('pity').querySelector('.txt').textContent=`${cfg.goal==='pity'?'pity':cfg.goal} ${cfg.cur}/${cfg.target}`; }

/* full-screen scenes: neon sign on the wall */
if(cfg.scene!=='main'){
  const n=$('neon');n.style.display='block';$('pity').style.display='none';
  const T={starting:['starting soon','grab a snack ~'],brb:['brb ~','refilling my drink'],ending:['thank you ♡','see you next live']}[cfg.scene]||['hi ♡',''];
  n.innerHTML=`<div class="sign">${T[0]}</div><br><div class="sub glass">${get('sub',T[1])}</div>`+(cfg.scene==='starting'?`<div class="count glass" id="cd"></div>`:'');
  if(cfg.scene==='starting'){const end=Date.now()+cfg.min*60000;const up=()=>{const r=Math.max(0,end-Date.now());
    $('cd').textContent=r?`${String(Math.floor(r/60000)).padStart(2,'0')}:${String(Math.floor(r/1000)%60).padStart(2,'0')}`:'any sec now';};up();setInterval(up,500);}
}

/* gacha pull: machine spins, glass toast pops up over the desk */
const TIERS=[{t:'R',w:55,c:'#9dd8ff',s:'★★★',m:['hi chat ♡','stay hydrated 💧','thanks for watching']},
             {t:'SR',w:32,c:'#c7a6ff',s:'★★★★',m:['follow = +1 luck 🍀','tap tap ♡','you’re SR tier']},
             {t:'SSR',w:13,c:'#ffd76a',s:'★★★★★',m:['jackpot viewer ✨','pity broken!!','SSR chat spotted']}];
function roll(){let r=R()*100;for(const x of TIERS){if((r-=x.w)<0)return x}return TIERS[0]}
function pull(){const g=$('gacha'),t=$('toast'),x=roll();
  g.classList.remove('spin');void g.offsetWidth;g.classList.add('spin');
  setTimeout(()=>{t.innerHTML=`<span class="tier" style="background:${x.c}">${x.t}</span><span class="stars">${x.s}</span><span class="msg">${x.m[Math.floor(R()*x.m.length)]}</span>`;t.classList.add('show')},900);
  setTimeout(()=>{t.classList.remove('show');g.classList.remove('spin')},5200);}
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='p')pull()});
if(cfg.pull>0 && cfg.part!=='back' && cfg.scene==='main'){setTimeout(pull,3000);setInterval(pull,cfg.pull*1000);}
</script>
</body>
</html>
